# Konfigurasi Nginx untuk KeuvaWeb (SPA statis).
# Salin ke /etc/nginx/sites-available/keuvaweb.com, sesuaikan `root`,
# lalu: ln -s /etc/nginx/sites-available/keuvaweb.com /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name keuvaweb.com www.keuvaweb.com;

    root /var/www/keuvaweb/dist;
    index index.html;

    # SPA fallback: semua rute yang tidak punya berkas fisik -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jangan di-cache lama (agar update langsung terlihat)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aset ber-hash Vite boleh di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
